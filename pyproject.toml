[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-engine"
version = "0.1.0"
description = "Bug bounty reconnaissance orchestrator covering every technique in The Bug Hunter's Methodology Day One"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "PyYAML>=6.0",
    "dnspython>=2.4",
    "cryptography>=41.0",
    "mmh3>=4.1",
]

[project.scripts]
recon-engine = "recon_engine.cli:main"

[tool.setuptools.packages.find]
include = ["recon_engine*"]
